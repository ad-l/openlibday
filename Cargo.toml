[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/ad-l/openlibday"

[workspace.dependencies]
libday-formats = { path = "crates/libday-formats" }
libday-data = { path = "crates/libday-data" }
libday-view = { path = "crates/libday-view" }
libday-sim = { path = "crates/libday-sim" }
thiserror = "2"
png = "0.17"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
miniz_oxide = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 2
